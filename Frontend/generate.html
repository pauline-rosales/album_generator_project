<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cover Generator – Generate</title>
  <link rel="stylesheet" href="/assets/styles.css"/>
</head>

<body>
  <nav class="navbar">
    <a class="logo" href="/">Cover Generator</a>
    <div class="nav-items">
      <a class="nav-item" href="/">Home</a>
      <a class="nav-item" href="/generate">Generate</a>
      <a class="nav-item" href="/customize">Customize</a>
      <a class="nav-item" href="/help">Help</a>
    </div>
  </nav>

  <div class="dashboard">

    <!-- LEFT PANEL -->
    <aside class="left-panel">
      <h2 class="panel-title">Playlist Information</h2>

      <div class="control-group" style="margin-top:10px">
        <a
          id="spotifyConnectBtn"
          class="platform-btn spotify-btn"
          href="/api/spotify/login"
        >
          Connect Spotify
        </a>
      </div>

      <div class="control-group" style="margin-top:10px">
        <label class="control-label">Choose a Playlist</label>
        <select id="playlistSelect" class="dropdown">
          <option value="">— Select —</option>
        </select>
      </div>

      <div class="playlist-info">
        <div class="playlist-title">Late Night Vibes</div>
        <div class="playlist-meta">24 songs • 1h 32m</div>
        <div id="playlistMood" style="margin-top:8px;font-size:13px;color:#c9b8f0;"></div>
      </div>

      <div class="control-label" style="margin:14px 0 6px;">Songs in this playlist</div>
      <div id="songList" class="song-list"></div>
    </aside>

    <!-- CENTER PANEL -->
    <main class="center-area">
      <div class="section-header">
        <h2 class="section-title">AI Cover Previews</h2>
        <button class="regenerate-btn">Generate</button>
      </div>

      <div class="cover-grid">
        <div class="cover-card selected">
          <div class="cover-preview">Cover A</div>
          <button class="select-btn">Select This</button>
        </div>

        <div class="cover-card">
          <div class="cover-preview">Cover B</div>
          <button class="select-btn">Select This</button>
        </div>

        <div class="cover-card">
          <div class="cover-preview">Cover C</div>
          <button class="select-btn">Select This</button>
        </div>
      </div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="right-panel">
      <h2 class="panel-title">Customization Tools</h2>

      <div class="control-group">
        <label class="control-label">Title Text</label>
        <input type="text" class="text-input" placeholder="Enter playlist title" value="Late Night Vibes">
      </div>

      <div class="control-group">
        <label class="control-label">Font Style</label>
        <select class="dropdown">
          <option>Modern Sans</option>
          <option>Classic Serif</option>
          <option>Bold Display</option>
          <option>Elegant Script</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label">Color Palette</label>
        <div class="color-swatches">
          <div class="color-swatch swatch-1 selected"></div>
          <div class="color-swatch swatch-2"></div>
          <div class="color-swatch swatch-3"></div>
          <div class="color-swatch swatch-4"></div>
          <div class="color-swatch swatch-5"></div>
          <div class="color-swatch swatch-6"></div>
          <div class="color-swatch swatch-7"></div>
          <div class="color-swatch swatch-8"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button class="primary-btn apply-btn">Apply Changes</button>
        <button class="primary-btn download-btn">Download Cover</button>
       <button id="shareBtn" class="primary-btn">
  Share Cover
</button>

</button>

      </div>
    </aside>
  </div>

  <!-- Toast for "changes applied" -->
  <div id="toast" class="toast"></div>

  <script src="/assets/app.js"></script>

  <!-- PAGE-SPECIFIC SCRIPT -->
 <script>
  document.addEventListener("DOMContentLoaded", () => {
    const cards          = Array.from(document.querySelectorAll(".cover-card"));
    const titleInput     = document.querySelector(".text-input");
    const fontSelect     = document.querySelector(".right-panel .dropdown");
    const swatches       = Array.from(document.querySelectorAll(".color-swatch"));
    const regenBtn       = document.querySelector(".regenerate-btn");
    const playlistSelect = document.getElementById("playlistSelect");
    const moodEl         = document.getElementById("playlistMood");
    const applyBtn       = document.querySelector(".apply-btn");
    const toastEl        = document.getElementById("toast");
    const spotifyBtn     = document.getElementById("spotifyConnectBtn");
    // --- Spotify button state + logout handler ---
    async function handleSpotifyLogout(e) {
      e.preventDefault();

      try {
        const res  = await fetch("/api/spotify/logout");
        const data = await res.json();

        if (!data.ok) {
          console.error("Logout failed:", data.error);
        }
      } catch (err) {
        console.error("Logout request error:", err);
      }

      // Clear any local UI / cache
      if (songListEl) songListEl.innerHTML = "";
      const plTitleEl = document.querySelector(".playlist-title");
      const plMetaEl  = document.querySelector(".playlist-meta");
      if (plTitleEl) plTitleEl.textContent = "No playlist selected";
      if (plMetaEl)  plMetaEl.textContent  = "";
      if (moodEl)    moodEl.textContent    = "";

      // Forget any cached AI images if you want
      try {
        localStorage.removeItem("ai_album_last_images");
      } catch (e) {
        console.warn("localStorage remove failed:", e);
      }

      // Update button back to "Connect Spotify"
      updateSpotifyButtonState();
    }

    async function updateSpotifyButtonState() {
      if (!spotifyBtn) return;

      try {
        const res  = await fetch("/api/spotify/state");
        const data = await res.json();

        const loggedIn = data.ok && data.playlists && data.playlists.length > 0;

        if (loggedIn) {
          spotifyBtn.textContent = "Logout of Spotify";
          spotifyBtn.href = "#";
          spotifyBtn.onclick = handleSpotifyLogout;
        } else {
          spotifyBtn.textContent = "Connect Spotify";
          spotifyBtn.href = "/api/spotify/login";
          spotifyBtn.onclick = null;
        }
      } catch (err) {
        console.error("Spotify state check failed:", err);
        // On error, fall back to "Connect"
        spotifyBtn.textContent = "Connect Spotify";
        spotifyBtn.href = "/api/spotify/login";
        spotifyBtn.onclick = null;
      }
    }

    
    const songListEl     = document.getElementById("songList");
    const shareBtn       = document.getElementById("shareBtn");
    const downloadBtn    = document.querySelector(".download-btn");

    let spotifyPlaylists = [];
    // --- Spotify button state + logout handler ---
    async function handleSpotifyLogout(e) {
      e.preventDefault();

      try {
        const res  = await fetch("/api/spotify/logout");
        const data = await res.json();
        if (!data.ok) {
          console.error("Logout failed:", data.error);
        }
      } catch (err) {
        console.error("Logout request error:", err);
      }

      // Clear playlist UI
      if (songListEl) songListEl.innerHTML = "";

      const plTitleEl = document.querySelector(".playlist-title");
      const plMetaEl  = document.querySelector(".playlist-meta");

      if (plTitleEl) plTitleEl.textContent = "No playlist selected";
      if (plMetaEl)  plMetaEl.textContent  = "";
      if (moodEl)    moodEl.textContent    = "";

      // Optionally forget cached images
      try {
        localStorage.removeItem("ai_album_last_images");
      } catch (e) {
        console.warn("localStorage remove failed:", e);
      }

      // Flip button back to "Connect Spotify"
      updateSpotifyButtonState();
    }

    async function updateSpotifyButtonState() {
      if (!spotifyBtn) return;

      try {
        const res  = await fetch("/api/spotify/state");
        const data = await res.json();

        const loggedIn = data.ok && data.playlists && data.playlists.length > 0;

        if (loggedIn) {
          // USER IS LOGGED IN
          spotifyBtn.textContent = "Logout of Spotify";
          spotifyBtn.href = "#";
          spotifyBtn.onclick = handleSpotifyLogout;
        } else {
          // USER IS LOGGED OUT
          spotifyBtn.textContent = "Connect Spotify";
          spotifyBtn.href = "/api/spotify/login";
          spotifyBtn.onclick = null;
        }
      } catch (err) {
        console.error("Spotify state check failed:", err);
        // Fallback: treat as logged out
        spotifyBtn.textContent = "Connect Spotify";
        spotifyBtn.href = "/api/spotify/login";
        spotifyBtn.onclick = null;
      }
    }

    
    

    function mapUiFont(name) {
      switch ((name || "").toLowerCase()) {
        case "classic serif":  return "Georgia, 'Times New Roman', serif";
        case "bold display":   return "'Impact','Haettenschweiler','Arial Black',sans-serif";
        case "elegant script": return "'Brush Script MT',cursive,'Segoe Script'";
        default:               return "Inter,'Segoe UI',sans-serif";
      }
    }

    function getSelectedCard() {
      return document.querySelector(".cover-card.selected");
    }

    function getSelectedPreview() {
      const card = getSelectedCard();
      return card ? card.querySelector(".cover-preview") : null;
    }

    function applyToCard(card) {
      if (!card) return;
      const preview = card.querySelector(".cover-preview");
      if (!preview) return;

      const title  = (titleInput.value || "").trim() || "";
      const fontUi = fontSelect.value;
      const swatch = document.querySelector(".color-swatch.selected");

      preview.textContent = title;
      preview.style.fontFamily = mapUiFont(fontUi);

      const hasAiImage =
        preview.style.backgroundImage &&
        preview.style.backgroundImage !== "none";

      if (swatch) {
        const color = getComputedStyle(swatch).backgroundColor;

        if (!hasAiImage) {
          preview.style.backgroundImage = "none";
          preview.style.backgroundColor = color;
          preview.style.color = "#1a1d2e";
        }
      }
    }

    function syncCardButtons() {
      cards.forEach(card => {
        const btn = card.querySelector(".select-btn");
        if (!btn) return;

        if (card.classList.contains("selected")) {
          btn.textContent = "Selected";
        } else {
          btn.textContent = "Select This";
        }
      });
    }

    syncCardButtons();

    cards.forEach(card => {
      const btn = card.querySelector(".select-btn");
      if (!btn) return;

      btn.addEventListener("click", () => {
        cards.forEach(c => c.classList.remove("selected"));
        card.classList.add("selected");
        syncCardButtons();
        applyToCard(card);
      });
    });

    titleInput.addEventListener("input", () => applyToCard(getSelectedCard()));
    fontSelect.addEventListener("change", () => applyToCard(getSelectedCard()));

    swatches.forEach(sw => {
      sw.addEventListener("click", () => {
        swatches.forEach(s => s.classList.remove("selected"));
        sw.classList.add("selected");
        applyToCard(getSelectedCard());
      });
    });

    function getCurrentSongs() {
      return Array.from(document.querySelectorAll("#songList .song-item"))
        .map(el => el.textContent.trim())
        .filter(Boolean);
    }

    function renderSongList(tracks) {
      if (!songListEl) return;
      songListEl.innerHTML = "";

      (tracks || []).forEach(t => {
        const div = document.createElement("div");
        div.className = "song-item";

        if (typeof t === "string") {
          div.textContent = t;
        } else {
          const name    = t.name || "";
          const artists = t.artists || "";
          div.textContent = artists ? `${name} — ${artists}` : name;
        }

        songListEl.appendChild(div);
      });
    }

    async function loadSpotifyState() {
      try {
        const res = await fetch("/api/spotify/state");
        if (!res.ok) {
          console.log("No Spotify data yet (status:", res.status, ")");
          return;
        }

        const data = await res.json();
        if (!data.ok) {
          console.log("Spotify state reported error:", data.error);
          return;
        }

        const playlists = data.playlists || [];
        const tracks    = data.firstPlaylistTracks || [];

        spotifyPlaylists = playlists;

        if (playlists.length > 0) {
          const first       = playlists[0];
          const plTitleEl   = document.querySelector(".playlist-title");
          const plMetaEl    = document.querySelector(".playlist-meta");

          if (playlistSelect) {
            playlistSelect.innerHTML = "";

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "— Select a playlist —";
            playlistSelect.appendChild(placeholder);

            playlists.forEach(pl => {
              const opt = document.createElement("option");
              opt.value = pl.id;
              opt.textContent = pl.name;
              playlistSelect.appendChild(opt);
            });

            playlistSelect.value = first.id;
          }

          if (plTitleEl) plTitleEl.textContent = first.name || "Playlist";
          if (plMetaEl) {
            const total = first.tracks && typeof first.tracks.total === "number"
              ? first.tracks.total
              : (tracks.length || 0);
            plMetaEl.textContent = `${total} songs`;
          }

          if (titleInput && first.name) {
            titleInput.value = first.name;
            applyToCard(getSelectedCard());
          }
        }

        if (tracks.length > 0) {
          renderSongList(tracks);
        }

        if (moodEl) {
          moodEl.textContent = "Spotify connected ✓";
        }

      } catch (err) {
        console.error("Error loading Spotify state:", err);
      }
    }

    if (playlistSelect) {
      playlistSelect.addEventListener("change", async () => {
        const selectedId = playlistSelect.value;

        if (!selectedId) {
          renderSongList([]);
          return;
        }

        const pl = spotifyPlaylists.find(p => p.id === selectedId);

        if (pl) {
          const plTitleEl = document.querySelector(".playlist-title");
          const plMetaEl  = document.querySelector(".playlist-meta");

          if (plTitleEl) plTitleEl.textContent = pl.name || "Playlist";
          if (plMetaEl) {
            const total = pl.tracks && typeof pl.tracks.total === "number"
              ? pl.tracks.total
              : "";
            plMetaEl.textContent = total ? `${total} songs` : "";
          }

          if (titleInput && pl.name) {
            titleInput.value = pl.name;
            applyToCard(getSelectedCard());
          }
        }

        try {
          const res = await fetch(`/api/spotify/playlist/${encodeURIComponent(selectedId)}/tracks`);
          if (!res.ok) {
            console.error("Error fetching playlist tracks:", res.status);
            return;
          }

          const data = await res.json();
          if (!data.ok) {
            console.error("Playlist tracks error:", data.error);
            return;
          }

          renderSongList(data.tracks || []);
        } catch (err) {
          console.error("Error in playlist change handler:", err);
        }
      });
    }

    let toastTimeoutId = null;
    function showToast(message) {
      if (!toastEl) return;
      toastEl.textContent = message;
      toastEl.classList.add("show");

      if (toastTimeoutId) {
        clearTimeout(toastTimeoutId);
      }
      toastTimeoutId = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2000);
    }

    if (applyBtn) {
      applyBtn.addEventListener("click", () => {
        const selected = getSelectedCard();
        if (!selected) return;

        const preview = selected.querySelector(".cover-preview");
        if (!preview) return;

        const swatch = document.querySelector(".color-swatch.selected");
        const color  = swatch ? getComputedStyle(swatch).backgroundColor : null;

        const rawBg = preview.style.backgroundImage;
        const hasRealImage =
          rawBg &&
          rawBg !== "none" &&
          !rawBg.startsWith("linear-gradient");

        const payload = {
          title: (titleInput?.value || "").trim(),
          font:  fontSelect?.value || "Modern Sans",
          color,
          backgroundImage: hasRealImage ? rawBg : null
        };

        const payloadStr = JSON.stringify(payload);
        let saved = false;

        try {
          window.localStorage.setItem("selected_cover_config", payloadStr);
          saved = true;
        } catch (e) {
          console.warn("localStorage failed, trying sessionStorage:", e);
          try {
            window.sessionStorage.setItem("selected_cover_config", payloadStr);
            saved = true;
          } catch (e2) {
            console.error("sessionStorage also failed:", e2);
          }
        }

        if (saved) {
          showToast("Changes applied – opening Customize ✨");
        } else {
          showToast("Couldn't save locally, but we'll still open Customize 👉");
        }

        setTimeout(() => {
          window.location.href = "/customize";
        }, 600);
      });
    }

    async function generateAI() {
      const selected = getSelectedCard();
      if (!selected) return;

      const originalLabel = regenBtn.textContent;
      regenBtn.disabled = true;
      regenBtn.textContent = "Generating...";

      let title = (titleInput.value || "").trim();
      let subtitle = "";

      if (playlistSelect && playlistSelect.value) {
        const selectedId = playlistSelect.value;
        const pl = spotifyPlaylists.find(p => p.id === selectedId);
        if (pl) {
          title = pl.name || title;
        }
      }

      const songs = getCurrentSongs();

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, subtitle, songs })
        });

        if (!res.ok) {
          const txt = await res.text();
          console.error("Backend error:", txt);
          throw new Error("Bad /api/generate response");
        }

        const data   = await res.json();
        const images = data.images || [];
        const mood   = data.mood;
        const top10  = data.top10 || [];

        if (moodEl && mood) {
          moodEl.textContent = `Detected mood: ${mood}`;
        }
        console.log("Top 10 vibe songs:", top10);

        if (images[0]) {
          localStorage.setItem("ai_album_image", images[0]);
        }

        images.forEach((url, i) => {
          const card = cards[i];
          if (!card) return;
          const preview = card.querySelector(".cover-preview");
          if (!preview) return;

          preview.style.backgroundImage    = `url(${url})`;
          preview.style.backgroundSize     = "cover";
          preview.style.backgroundPosition = "center";
          preview.style.backgroundRepeat   = "no-repeat";
          preview.style.backgroundColor    = "#000";

          applyToCard(card);
        });
      } catch (err) {
        console.error(err);
        alert("Error generating AI covers (check terminal).");
      } finally {
        regenBtn.disabled = false;
        regenBtn.textContent = originalLabel;
      }
    }

    if (regenBtn) {
      regenBtn.addEventListener("click", generateAI);
    }

    // ====== helpers for download + share ======
    function extractBackgroundUrl(bg) {
      if (!bg || bg === "none") return null;
      const match = bg.match(/url\(["']?(.*?)["']?\)/);
      return match ? match[1] : null;
    }

    function getFileBaseTitle() {
      const t = (titleInput?.value || "playlist").trim() || "playlist";
      const slugFn = window.slug || function (s) {
        return String(s)
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      };
      return slugFn(t);
    }

    // ✅ Download selected cover
    if (downloadBtn) {
      downloadBtn.addEventListener("click", async () => {
        const preview = getSelectedPreview();
        if (!preview) {
          alert("Select a cover first.");
          return;
        }

        const bg = preview.style.backgroundImage;
        const url = extractBackgroundUrl(bg);
        if (!url) {
          alert("Generate a cover first before downloading.");
          return;
        }

        const fileName = `cover_${getFileBaseTitle()}.png`;

        // if it's a data URL we can just use it directly
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        a.click();
      });
    }

    // ✅ Share selected cover (or fall back to download)
    if (shareBtn) {
      shareBtn.addEventListener("click", async () => {
        const preview = getSelectedPreview();
        if (!preview) {
          alert("Select a cover first.");
          return;
        }

        const bg = preview.style.backgroundImage;
        const url = extractBackgroundUrl(bg);
        if (!url) {
          alert("Generate a cover first before sharing.");
          return;
        }

        const fileName = `cover_${getFileBaseTitle()}.png`;

        try {
          const res = await fetch(url);
          const blob = await res.blob();
          const file = new File([blob], fileName, { type: "image/png" });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
              title: titleInput?.value || "Playlist cover",
              files: [file]
            });
          } else {
            // Fallback: just download + message
            const a = document.createElement("a");
            const dlUrl = URL.createObjectURL(blob);
            a.href = dlUrl;
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(dlUrl);
            alert("Sharing isn't fully supported here, so the cover was downloaded instead.");
          }
        } catch (err) {
          console.error("Share error:", err);
          alert("Could not share this cover on this browser.");
        }
      });
    }

    loadSpotifyState();
    updateSpotifyButtonState();

  });
</script>

  
</body>
</html>
